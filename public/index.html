<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Redirecting to Francesco Magalini on LinkedIn.">
    <title>Redirecting to LinkedIn</title>
    <link rel="canonical" href="https://www.linkedin.com/in/francescomagalini">
    <meta http-equiv="refresh" content="0; url=https://www.linkedin.com/in/francescomagalini">
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #162033;
            --muted: #586173;
            --accent: #0a66c2;
            --accent-hover: #084f96;
            --shadow: 0 20px 45px rgba(22, 32, 51, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top, rgba(10, 102, 194, 0.12), transparent 35%),
                linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
            color: var(--text);
        }

        main {
            width: min(100%, 560px);
            padding: 40px 32px;
            border-radius: 24px;
            background: var(--card);
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 2.6rem);
            line-height: 1.1;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 14px 22px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>
    <main>
        <h1>Redirecting to LinkedIn</h1>
        <p>If you are not redirected automatically, open Francesco Magalini's LinkedIn profile.</p>
        <a href="https://www.linkedin.com/in/francescomagalini">Open LinkedIn</a>
    </main>
    <script>
        window.location.replace("https://www.linkedin.com/in/francescomagalini");
    </script>
</body>
</html>
